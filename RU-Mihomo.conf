# =============================================================================
#  RU-Mihomo.conf - OpenClash overwrite file for RU-Mihomo.yaml
# =============================================================================
#  How to use:
#    1. Put the config and the rule-sets on the router:
#         /etc/openclash/config/RU-Mihomo.yaml
#         /etc/openclash/ruleset/*.mrs
#       see docs/INSTALL.md
#    2. Set the two values marked REQUIRED below.
#    3. Import this file in OpenClash -> config management -> download config
#       (point it at the raw URL of this file), or copy it to
#       /etc/openclash/backup/ and pick it in the overwrite settings.
#
#  What OpenClash does to your config, and why these options are set here:
#    On every start OpenClash REWRITES DNS, fake-ip-filter, hosts, sniffer,
#    authentication, the controller address and the secret in your YAML
#    (yml_change.sh, 946 lines). Without the options below the plugin
#    installs its own defaults and breaks the Russian routing logic:
#      - IPV6_ENABLE = 0        (IPv6 from Russian ISPs is often broken, and
#                                 it breaks fake-ip as well)
#      - CHINA_IP_ROUTE = 0     (no China route table: it wastes flash space
#                                 and means nothing for Russia)
#      - CUSTOM_NAME_POLICY = 0 (keep the nameserver-policy from the YAML)
#      - CUSTOM_FAKEIP_FILTER = 0 (keep our fake-ip-filter from the YAML)
#      - FIND_PROCESS_MODE = off (process lookup is expensive on a router)
#    GLOBAL_CLIENT_FINGERPRINT is intentionally NOT set: the option was removed
#    from mihomo and the core only logs a warning about it.
#
#  Note on node filters: the filters live on the proxy GROUPS in the YAML, not
#  on the provider. OpenClash rewrites provider-level filter/exclude-filter
#  when a node filter is set in its UI, which would silently disable the
#  Russian/LTE split.
#
#  Note on the proxy groups: do not create proxy groups in the OpenClash UI.
#  OpenClash rebuilds the whole proxy-groups block from its own storage and
#  would overwrite the design of the YAML.
#
#  Details: docs/DESIGN.md, docs/INSTALL.md
# =============================================================================

[General]
# --- Core and ports ---
# CORE_TYPE = Meta
# CORE_TYPE = Smart        (only for RU-Mihomo-smart.yaml: the smart core is
#                           the fork vernesong/mihomo, upstream has no type
#                           "smart")
# PROXY_PORT = 7890
# HTTP_PORT = 7890
# SOCKS_PORT = 7891
# MIXED_PORT = 7893
# DNS_PORT = 7874

# --- REQUIRED: the subscription ---
# There is exactly ONE subscription, a backup is not needed.
SUB_INFO_URL = PASTE_SUBSCRIPTION_URL_HERE

# --- REQUIRED: the dashboard password ---
# This value becomes the "secret" of the mihomo API. It must not be empty:
# with an empty secret the API answers with "Access-Control-Allow-Origin: *",
# so any web page in the LAN can drive the proxy.
# OpenClash writes it into openclash.@overwrite[0].dashboard_password.
DASHBOARD_PASSWORD = CHANGE_ME

# --- DNS ---
# WARNING: EN_MODE = fake-ip-mix switches to a mixed mode and OpenClash will
# rewrite our dns.enable. To get exactly what the YAML says, keep
# EN_MODE = fake-ip and disable the DNS rewrite (see ENABLE_CUSTOM_DNS below).
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 0
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0
STORE_FAKEIP = 1
CUSTOM_FAKEIP_FILTER = 0
CUSTOM_FAKEIP_FILTER_MODE = blacklist
FAKEIP_RANGE = 198.18.0.1/16
ENABLE_RESPECT_RULES = 1
CUSTOM_NAME_POLICY = 0
CUSTOM_HOST = 0
CUSTOM_FALLBACK_FILTER = 0

# --- IPv6 ---
# IPv6 often does not work correctly from Russian ISPs, and it breaks
# fake-ip and part of the web. Disabled.
IPV6_ENABLE = 0
IPV6_DNS = 0
IPV6_MODE = 0
ENABLE_V6_UDP_PROXY = 0

# --- Proxy and mode ---
EN_MODE = fake-ip
ENABLE_UDP_PROXY = 1
ROUTER_SELF_PROXY = 1
STACK_TYPE = system
PROXY_MODE = rule

# --- Firewall ---
INTRANET_ALLOWED = 1
BYPASS_GATEWAY_COMPATIBLE = 0

# --- Traffic separation ---
# NO CHINA ROUTING: china_ip_route.ipset takes up flash space and is
# meaningless for Russia. All the logic is in our YAML.
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0
CHNR_AUTO_UPDATE = 0

# --- Sniffer ---
# Keep it as in the YAML: the sniffer is needed so domain rules fire for
# connections made to an IP.
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_CUSTOM = 0
ENABLE_META_SNIFFER_PURE_IP = 0

# --- Performance ---
ENABLE_TCP_CONCURRENT = 1
FIND_PROCESS_MODE = off
# GLOBAL_CLIENT_FINGERPRINT - intentionally empty: the option was removed from
# mihomo, with it present the core writes a warning on every start.
ENABLE_UNIFIED_DELAY = 1

# --- Smart groups ---
# We do NOT use the smart core by default: type: smart exists only in the
# vernesong/mihomo fork, upstream MetaCubeX does not have it.
# AUTO_SMART_SWITCH = 1 would turn every url-test group into a smart group.
AUTO_SMART_SWITCH = 0
SMART_ENABLE_LGBM = 0
# The options below are only used when a group has the type "smart". Leave
# them at 0 to keep the values from the YAML.
# SMART_POLICY_PRIORITY = Premium:1.30;SG:1.15
# SMART_PREFER_ASN = 1
# SMART_TOLERANCE = 50
# SMART_COLLECT = 0
# SMART_COLLECT_RATE = 1
# SMART_COLLECT_SIZE = 100

# --- Geo databases ---
# OFF on purpose: this config never reads GeoIP.dat (16.5 MB) or GeoSite.dat
# (4.4 MB), and a router with 84.8 MB of flash cannot afford 21 MB for
# nothing. The rule-sets in ruleset/ are local files and need no database.
ENABLE_GEOIP_DAT = 0
GEODATA_LOADER = memconservative
GEOIP_AUTO_UPDATE = 0
GEOIP_UPDATE_WEEK_TIME = *
GEOIP_UPDATE_DAY_TIME = 5
GEOSITE_AUTO_UPDATE = 0
GEOSITE_UPDATE_WEEK_TIME = *
GEOSITE_UPDATE_DAY_TIME = 5
GEO_AUTO_UPDATE = 0
GEO_UPDATE_WEEK_TIME = *
GEO_UPDATE_DAY_TIME = 5
GEOASN_AUTO_UPDATE = 0

# --- Miscellaneous ---
# SMALL_FLASH_MEMORY = 1 - enable it if the router has little flash:
#   geo databases and logs move to /tmp (they will not survive a reboot).
SMALL_FLASH_MEMORY = 0
DISABLE_QUIC_GO_GSO = 1
DISABLE_UDP_QUIC = 1
DELAY_START = 0
SKIP_PROXY_ADDRESS = 1
RESTART = false

# --- Config download ---
# Replace the URL with your own (GitHub raw / gist / your own server).
# To use the smaller variant without ad blocking, change both lines to
# RU-Mihomo-lite.yaml - it costs about 4 MB less RAM.
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/Frog2233-DevOps/Mihomo-personal-config/refs/heads/main/RU-Mihomo.yaml, path=/etc/openclash/config/RU-Mihomo.yaml, cron=0 5 * * *, force=false
CONFIG_FILE = /etc/openclash/config/RU-Mihomo.yaml

[Overwrite]
# Substitute the subscription URL into the node provider.
# SUB_INFO_URL - the one and only subscription.
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "Main" "['url']" "PASTE_SUBSCRIPTION_URL_HERE"
