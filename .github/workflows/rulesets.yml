name: Rebuild rule-sets

on:
  schedule:
    # every day at 04:23 UTC
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    # every branch: the rule-sets are binary files, they cannot be written by
    # hand, so the workflow builds them and commits the result

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          set -e
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo

      - name: Rebuild the rule-sets
        run: bash ./scripts/build-ruleset.sh

      - name: Selftest
        run: bash ./scripts/selftest.sh
        env:
          MIHOMO: ./mihomo

      - name: Commit the new rule-sets
        # the guard stops the loop: the commit of this step triggers the
        # workflow again, and that run must not commit anything.
        # On a schedule or a manual run the commit always happens.
        if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the files that came through the API have no executable bit - set it
          # once here, the commit below carries the mode into the repository
          chmod +x scripts/*.sh scripts/*.py
          git add ruleset scripts
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore(ruleset): rebuild $(date -u +%F)"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the router
        env:
          ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
          ROUTER_USER: ${{ secrets.ROUTER_USER }}
          ROUTER_PORT: ${{ secrets.ROUTER_PORT }}
          ROUTER_PATH: ${{ secrets.ROUTER_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # reload: the core reads its config again through its own API, the
          # proxy stays up. restart: the core is restarted, the proxy is down
          # for half a minute. none: the new lists are used after the next
          # restart.
          APPLY: "reload"
        run: |
          set -e
          if [ -z "$ROUTER_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ROUTER_HOST / SSH_PRIVATE_KEY are not set - nothing is deployed."
            echo "Add them as repository secrets to push the rule-sets to the router."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -p ${ROUTER_PORT:-22} -i ~/.ssh/deploy_key"
          REMOTE="${ROUTER_USER:-root}@$ROUTER_HOST"
          PATH_ON_ROUTER="${ROUTER_PATH:-/etc/mihomo}"
          # the layout of mixomo: the rule-sets in rule-files/, the scripts
          # next to them, the lists in lists/
          ssh $SSH_OPTS "$REMOTE" "mkdir -p '$PATH_ON_ROUTER/rule-files' '$PATH_ON_ROUTER/scripts' '$PATH_ON_ROUTER/lists'"
          # scp -O: OpenSSH 9 copies over SFTP by default and the dropbear of
          # OpenWrt has no sftp-server.
          scp -O -P "${ROUTER_PORT:-22}" -i ~/.ssh/deploy_key ruleset/*.mrs \
            "$REMOTE:$PATH_ON_ROUTER/rule-files/"
          scp -O -P "${ROUTER_PORT:-22}" -i ~/.ssh/deploy_key \
            scripts/build-ruleset.sh scripts/gen-mtrickle.sh scripts/update-mixomo.sh \
            scripts/apply-rulesets.sh scripts/check-groups.sh \
            "$REMOTE:$PATH_ON_ROUTER/scripts/"
          ssh $SSH_OPTS "$REMOTE" \
            "chmod +x '$PATH_ON_ROUTER/scripts/'*.sh && APPLY=$APPLY sh '$PATH_ON_ROUTER/scripts/apply-rulesets.sh'"

      - name: Check what the router has now
        env:
          ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
          ROUTER_USER: ${{ secrets.ROUTER_USER }}
          ROUTER_PORT: ${{ secrets.ROUTER_PORT }}
          ROUTER_PATH: ${{ secrets.ROUTER_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$ROUTER_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "no router - nothing to check"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -p ${ROUTER_PORT:-22} -i ~/.ssh/deploy_key"
          REMOTE="${ROUTER_USER:-root}@$ROUTER_HOST"
          PATH_ON_ROUTER="${ROUTER_PATH:-/etc/mihomo}"
          ssh $SSH_OPTS "$REMOTE" \
            "ls '$PATH_ON_ROUTER'/rule-files/*.mrs | wc -l; \
             APPLY=check sh '$PATH_ON_ROUTER'/scripts/apply-rulesets.sh"
