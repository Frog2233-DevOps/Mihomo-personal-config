name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          set -e
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Build the rule-sets
        run: bash ./scripts/build-ruleset.sh

      - name: Selftest
        run: bash ./scripts/selftest.sh
        env:
          MIHOMO: ./mihomo

      - name: Full test suite
        run: bash ./tests/run-all.sh
        env:
          MIHOMO: ./mihomo
