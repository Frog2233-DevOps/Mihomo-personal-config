# This file belongs to .github/workflows/ - copy it there:
#     cp automation/validate.yml .github/workflows/validate.yml
# It is kept here as well so that the content is reviewable in a pull request.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          set -e
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Download the smart core
        run: |
          set -e
          url=$(curl -fsSL "https://api.github.com/repos/vernesong/mihomo/releases/tags/Prerelease-Alpha" \
                | grep -o '"browser_download_url": *"[^"]*linux-amd64-alpha-smart[^"]*\.gz"' \
                | head -1 | cut -d'"' -f4)
          if [ -z "$url" ]; then
            echo "no smart core found - the smart variant is not checked"
            exit 0
          fi
          curl -fsSL -o mihomo-smart.gz "$url"
          gunzip -f mihomo-smart.gz
          chmod +x mihomo-smart
          ./mihomo-smart -v

      - name: Build the rule-sets
        run: ./scripts/build-ruleset.sh

      - name: Selftest
        run: ./scripts/selftest.sh
        env:
          MIHOMO: ./mihomo
          MIHOMO_SMART: ./mihomo-smart
